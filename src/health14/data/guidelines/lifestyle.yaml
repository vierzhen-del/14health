# 연령대별 생활습관 권고 + 위험 태그별 권고
age_bands:
  - age_min: 0
    age_max: 6
    advice:
      - 수면 10~13시간 규칙적 유지
      - 단 음료·과자 제한, 고른 이유식/식단
      - 하루 3시간 이상 신체활동(놀이)
      - 스크린 시청 하루 1시간 이내
  - age_min: 7
    age_max: 19
    advice:
      - 수면 8~10시간, 규칙적 기상
      - 매일 60분 이상 중강도 신체활동
      - 탄산음료·패스트푸드 줄이기, 아침식사 챙기기
      - 바른 자세·척추 건강, 스마트폰 사용 시간 관리
  - age_min: 20
    age_max: 39
    advice:
      - 주 150분 이상 유산소 + 주 2회 근력운동
      - 절주(주 2회 이하)·금연
      - 아침식사·규칙적 식사, 나트륨 줄이기
      - 수면 7시간 이상, 스트레스 관리(취미·휴식)
  - age_min: 40
    age_max: 64
    advice:
      - 체중·허리둘레 정기 확인 (대사증후군 예방)
      - 주 150분 유산소 + 근력운동, 계단 이용 생활화
      - 저염·저당 식단, 채소·생선 위주
      - 금연·절주, 혈압 자가측정 습관
      - 정기 검진 주기 엄수 (암검진 포함)
  - age_min: 65
    age_max: 120
    advice:
      - 근감소 예방 — 단백질 섭취(체중 1kg당 1g 이상)·근력운동
      - 낙상 예방 — 균형운동, 집안 환경 정비
      - 하루 30분 걷기, 사회활동 유지(치매 예방)
      - 겨울철 혈압 관리, 예방접종 챙기기
      - 복용 약물 정기 점검(다약제 주의)

risk_advice:
  혈압:
    - 하루 소금 5g 이하 저염식 (국물 줄이기)
    - 주 150분 이상 유산소 운동
    - 금연·절주, 카페인 과다 섭취 주의
    - 가정혈압 아침·저녁 측정 기록
  혈당:
    - 정제 탄수화물·단 음료 줄이기, 식이섬유 늘리기
    - 식후 30분 걷기 습관
    - 체중 5% 감량 목표 (과체중 시)
    - 공복혈당·당화혈색소 정기 추적
  지질:
    - 포화지방(튀김·가공육) 줄이고 생선·견과류 섭취
    - 주 150분 이상 유산소 운동
    - 금연 (HDL 개선에 가장 효과적)
  비만:
    - 하루 500kcal 감량 목표의 식사 조절
    - 주 5회 30분 이상 유산소 + 근력운동 병행
    - 야식·음주 줄이기, 식사 기록 습관
  간:
    - 금주 또는 절주 (간수치 회복의 핵심)
    - 불필요한 약물·건강보조식품 정리
    - 체중 감량 (지방간 개선)
  신장:
    - 저염식, 단백질 과다 섭취 주의
    - 충분한 수분 섭취, 진통제(NSAIDs) 남용 금지
    - 혈압·혈당 관리가 신장 보호의 기본
  빈혈:
    - 철분 풍부 식품(붉은 고기·시금치·콩) 섭취
    - 비타민C와 함께 섭취 시 흡수율 증가
    - 원인 확인 위한 진료 권장 (특히 여성)
