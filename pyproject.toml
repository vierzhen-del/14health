[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health14"
version = "0.1.0"
description = "가족 건강기록 옵시디안(Obsidian) 관리 도구 — 로컬 전용, 관계호칭 익명화"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
share = ["Pillow>=10.0"]
dev = ["pytest>=7.0", "Pillow>=10.0"]

[project.scripts]
"14health" = "health14.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
health14 = ["data/guidelines/*.yaml", "templates/*.html"]
